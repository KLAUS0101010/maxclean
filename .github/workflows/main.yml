name: Build MAX Clean
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct link to the official MAX .apk (see INSTRUCTION-RU.md, step 2)"
        required: true
      publish:
        description: "Also publish the results as a public Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # D: change nothing, only repack and re-sign. If D already misbehaves, our patches are not the cause.
          - { name: "D-control", mode: "none",  decode: "-r" }
          # A: only the tracker host names -> 0.0.0.0
          - { name: "A-hosts",   mode: "hosts", decode: "-r" }
          # B: A + stubs for send-methods + zero advertising id (no manifest / resource changes)
          - { name: "B-code",    mode: "code",  decode: "-r" }
          # C: everything: B + manifest permission + app name "MAX Clean" (resources are decoded and rebuilt)
          - { name: "C-full",    mode: "all",   decode: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Test the patcher
        run: python3 -I tests/test_patch.py

      - name: Download MAX
        env: { APK_URL: "${{ inputs.apk_url }}" }
        run: |
          curl -L --fail --retry 3 -o max.apk "$APK_URL"
          ls -la max.apk
          unzip -l max.apk | grep -q "AndroidManifest.xml" || { echo "This is not an .apk file (maybe .xapk/.apks bundle or a web page)."; exit 1; }
          unzip -l max.apk | grep -q "classes.dex" || { echo "No classes.dex inside: not a normal universal apk."; exit 1; }

      - name: Get apktool
        run: curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Unpack
        env: { DECODE: "${{ matrix.decode }}" }
        run: java -Xmx4g -jar apktool.jar d $DECODE -f -o dec max.apk

      - name: Report (what is inside the original MAX)
        if: ${{ matrix.name == 'D-control' }}
        run: |
          python3 -I analyze_apk.py dec > report.txt
          { echo '```'; head -c 60000 report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.name == 'D-control' }}
        with:
          name: report
          path: report.txt

      - name: Patch (${{ matrix.mode }})
        run: python3 -I patch_max.py dec ${{ matrix.mode }} 2>&1 | tee patch-log.txt

      - name: Repack
        run: java -Xmx4g -jar apktool.jar b -o unsigned.apk dec

      - name: Sign (same key for every variant, so they can be installed over each other)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks maxclean.jks --ks-pass pass:maxclean --key-pass pass:maxclean \
            --out MAX-Clean-${{ matrix.name }}.apk aligned.apk
          "$BT/apksigner" verify --verbose MAX-Clean-${{ matrix.name }}.apk | head -5
          ls -la MAX-Clean-${{ matrix.name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MAX-Clean-${{ matrix.name }}
          path: MAX-Clean-${{ matrix.name }}.apk

      - name: Publish release (optional)
        if: ${{ inputs.publish }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "clean-${{ github.run_number }}-${{ matrix.name }}" MAX-Clean-${{ matrix.name }}.apk --title "MAX Clean ${{ matrix.name }} build ${{ github.run_number }}" --notes "Official MAX with third-party trackers removed (variant ${{ matrix.name }})."
