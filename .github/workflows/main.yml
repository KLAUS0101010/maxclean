name: Build MAX Clean
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct link to the official MAX .apk"
        required: true
        default: "https://github.com/KLAUS0101010/maxclean/releases/download/src/MAX.apk"
      publish:
        description: "Also publish the results as a public Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "full",    patch: "full" }
          - { name: "minimal", patch: "hosts" }
          - { name: "control", patch: "none" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Test the patcher
        run: |
          if [ -f tests/test_patch.py ]; then
            python3 -I tests/test_patch.py
          elif [ -f test_patch.py ]; then
            python3 -I test_patch.py
          fi

      - name: Download MAX
        env:
          APK_URL: "${{ inputs.apk_url }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          if [[ "$APK_URL" =~ /releases/download/([^/]+)/([^/]+)$ ]]; then
            TAG="${BASH_REMATCH[1]}"
            FILE="${BASH_REMATCH[2]}"
            gh release download "$TAG" -p "$FILE" -O max.apk || curl -L --fail --retry 3 -o max.apk "$APK_URL"
          else
            curl -L --fail --retry 3 -o max.apk "$APK_URL"
          fi

          ls -la max.apk
          unzip -l max.apk | grep -q "AndroidManifest.xml" || { echo "This is not an .apk file."; exit 1; }
          unzip -l max.apk | grep -q "classes.dex" || { echo "No classes.dex inside."; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          "$BT/aapt2" dump badging max.apk | grep -E "^(package|launchable-activity)" | tee original-badging.txt

      - name: Ensure signing key
        run: |
          if [ ! -f maxclean.jks ]; then
            echo "Generating maxclean.jks key..."
            keytool -genkeypair -v -keystore maxclean.jks -storepass maxclean \
              -alias maxclean -keypass maxclean -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MAXClean, OU=MAX, O=Clean, L=City, S=State, C=RU"
          fi

      - name: Get apktool
        if: ${{ matrix.patch != 'none' }}
        run: curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      # ---- code: decode only the code (-r: resources and manifest are not touched), patch, rebuild
      - name: Code - unpack
        if: ${{ matrix.patch != 'none' }}
        run: |
          java -Xmx4g -jar apktool.jar d -r -f -o dec_code max.apk
          if [ -f dex_api.py ]; then
            python3 -I dex_api.py max.apk dec_code
          fi

      - name: Code - patch (${{ matrix.patch }})
        if: ${{ matrix.patch != 'none' }}
        run: python3 -I patch_max.py dex dec_code ${{ matrix.patch }} 2>&1 | tee patch-log.txt

      - name: Code - rebuild
        if: ${{ matrix.patch != 'none' }}
        run: java -Xmx4g -jar apktool.jar b -o code.apk dec_code

      # ---- manifest (full only): decode manifest, patch, compile without breaking on broken resources
      - name: Manifest - unpack, patch, rebuild
        if: ${{ matrix.patch == 'full' }}
        run: |
          java -Xmx4g -jar apktool.jar d --no-src -f -o dec_res max.apk
          python3 -I patch_max.py manifest dec_res 2>&1 | tee -a patch-log.txt
          
          # Пробуем стандартный билд; если aapt2 падает на обфусцированных XML ресурсах — линкуем напрямую
          if ! java -Xmx4g -jar apktool.jar b -o res.apk dec_res; then
            echo "apktool b failed on resources, linking patched AndroidManifest.xml directly via aapt2..."
            PLATFORM=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar
            "$BT/aapt2" link -I "$PLATFORM" -I max.apk \
              --manifest dec_res/AndroidManifest.xml \
              -o res.apk
          fi

      # ---- result = the original apk + only the changed parts
      - name: Graft (original + changed dex files + manifest)
        run: |
          case "${{ matrix.patch }}" in
            full)    python3 -I graft_apk.py max.apk grafted.apk --dex-from code.apk --report dec_code/patch-report.json --manifest-from res.apk ;;
            hosts)   python3 -I graft_apk.py max.apk grafted.apk --dex-from code.apk --report dec_code/patch-report.json ;;
            *)       python3 -I graft_apk.py max.apk grafted.apk ;;
          esac

      - name: Check the manifest (resource ids must not have shifted)
        if: ${{ matrix.patch == 'full' }}
        run: |
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml max.apk > manifest-orig.txt
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml grafted.apk > manifest-new.txt
          python3 -I check_manifest.py manifest-orig.txt manifest-new.txt | tee -a patch-log.txt

      - name: Check that nothing else changed in the file list
        run: |
          unzip -Z1 max.apk | grep -v '^META-INF/' | sort > files-orig.txt
          unzip -Z1 grafted.apk | grep -v '^META-INF/' | sort > files-new.txt
          diff files-orig.txt files-new.txt && echo "same files as in the original (except signature)"

      - name: Align and sign (same key for every variant, so they can be installed over each other)
        run: |
          "$BT/zipalign" -f -p 4 grafted.apk aligned.apk
          "$BT/apksigner" sign --ks maxclean.jks --ks-pass pass:maxclean --key-pass pass:maxclean \
            --out MAX-Clean-${{ matrix.name }}.apk aligned.apk
          "$BT/apksigner" verify --verbose MAX-Clean-${{ matrix.name }}.apk | head -5
          "$BT/aapt2" dump badging MAX-Clean-${{ matrix.name }}.apk | grep -E "^(package|launchable-activity)" > new-badging.txt
          norm() { sed -E "s/ (label|icon|platformBuild[A-Za-z]*|compileSdk[A-Za-z]*)='[^']*'//g" "$1"; }
          diff <(norm original-badging.txt) <(norm new-badging.txt) && echo "package, version and launch activity are the same as in the original"
          ls -la MAX-Clean-${{ matrix.name }}.apk

      - name: Summary
        if: ${{ always() }}
        run: |
          { echo "### ${{ matrix.name }}"; echo '`'; cat patch-log.txt 2>/dev/null || echo "(no patching in this variant)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MAX-Clean-${{ matrix.name }}
          path: MAX-Clean-${{ matrix.name }}.apk

      - name: Publish release (optional)
        if: ${{ inputs.publish }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "clean-${{ github.run_number }}-${{ matrix.name }}" MAX-Clean-${{ matrix.name }}.apk --title "MAX Clean ${{ matrix.name }} build ${{ github.run_number }}" --notes "Official MAX with tracking removed (variant ${{ matrix.name }})."
